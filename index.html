<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paty</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope" id="envelope">
                <div class="envelope-body"></div>
                <div class="envelope-flap" id="flap"></div>
            </div>
            <div class="lock-heart" id="lockHeart"></div>
            <div class="letter" id="letter">
                <div class="letter-content">
                    <div class="heart">☘️</div>
                    <div class="letter-text" id="letterText">
                        <p>Cargando mensaje...</p>
                    </div>
                    <div class="letter-footer">
                        <p class="from">De: <span id="fromName">Alfredo</span></p>
                        <p class="to">Para: <span id="toName">Paty</span></p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" id="openBtn" disabled>OPEN</button>
            <button class="btn btn-secondary" id="resetBtn" disabled>CLOSE</button>
        </div>

        <dialog class="password-dialog" id="passwordDialog" aria-labelledby="passwordDialogTitle">
            <form class="password-form" method="dialog" id="passwordForm">
                <h2 id="passwordDialogTitle">Enter the password</h2>
                <label for="passwordInput">Password</label>
                <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
                <div class="password-actions">
                    <button class="btn btn-primary" type="submit" value="confirm">OPEN</button>
                    <button class="btn btn-secondary" type="submit" value="cancel" formnovalidate>CANCEL</button>
                </div>
            </form>
        </dialog>
        
        <!-- Container for floating hearts -->
        <div class="floating-hearts" id="floatingHearts"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
